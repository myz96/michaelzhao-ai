<style>
:root { --white: #fcfcfa; --black: #111110; --grey: #8a8a85; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {

#ink {

/* custom cursor dot */
#dot {

  pointer-events: none;

}
body.has-dot #dot { opacity: 0.85; }
body.has-dot.dot-grow #dot { width: 14px; height: 14px; opacity: 0.35; }
@media (hover: none) { #dot { display: none; } }

.corner, main { position: relative; z-index: 1; }

.corner.tl { top: 0; left: 0; color: var(--black); }
.corner.tr { top: 0; right: 0; text-align: right; }
.corner.bl { bottom: 0; left: 0; }
.corner.br { bottom: 0; right: 0; text-align: right; }
.corner a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: color 0.25s, border-color 0.25s;

.corner a:hover { color: var(--black); border-color: var(--black); }

main {

<script>
(function () {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* ---- cursor dot ---- */
  if (finePointer && !reduced) {
    const dot = document.getElementById('dot');
    let tx = -100, ty = -100, x = -100, y = -100, shown = false;
    addEventListener('pointermove', (e) => {
      tx = e.clientX; ty = e.clientY;
      if (!shown) { shown = true; document.body.classList.add('has-dot'); }
    }, { passive: true });
    document.querySelectorAll('a').forEach((a) => {
      a.addEventListener('pointerenter', () => document.body.classList.add('dot-grow'));
      a.addEventListener('pointerleave', () => document.body.classList.remove('dot-grow'));
    });
    (function loop() {
      x += (tx - x) * 0.18;
      y += (ty - y) * 0.18;
      dot.style.transform = 'translate(' + (x - 3) + 'px,' + (y - 3) + 'px)';
      requestAnimationFrame(loop);
    })();
  }

  /* ---- magnetic corner links ---- */
  if (finePointer && !reduced) {
    document.querySelectorAll('.corner a, .works a').forEach((a) => {
      a.addEventListener('pointermove', (e) => {
        const r = a.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2);
        const dy = e.clientY - (r.top + r.height / 2);
        a.style.transform = 'translate(' + dx * 0.12 + 'px,' + dy * 0.18 + 'px)';
      });
      a.addEventListener('pointerleave', () => { a.style.transform = ''; });
    });
  }

  /* ---- ink shader ---- */
  if (reduced) return;
  const canvas = document.getElementById('ink');
  const gl = canvas.getContext('webgl', { alpha: true, antialias: false });
  if (!gl) return;

  const TRAIL = 24;

  const vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
  const fs = [
    'precision highp float;',
    'uniform vec2 res;',
    'uniform float t;',
    'uniform vec3 trail[' + TRAIL + '];',
    'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float noise(vec2 p) {',
    '  vec2 i = floor(p), f = fract(p);',
    '  vec2 u = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),',
    '             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
    '}',
    'float fbm(vec2 p) {',
    '  float v = 0.0, a = 0.5;',
    '  for (int i = 0; i < 4; i++) { v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }',
    '  return v;',
    '}',
    'void main() {',
    '  vec2 uv = gl_FragCoord.xy / res;',
    '  vec2 asp = vec2(res.x / res.y, 1.0);',
    '  float field = fbm(uv * asp * 2.2 + vec2(t * 0.015, -t * 0.01));',
    '  float tone = 0.985 + field * 0.015;',
    '  float ink = 0.0;',
    '  for (int i = 0; i < ' + TRAIL + '; i++) {',
    '    vec3 tp = trail[i];',
    '    if (tp.z <= 0.0) continue;',
    '    vec2 d = (uv - tp.xy) * asp;',
    '    float dist = length(d);',
    '    float w = fbm(uv * asp * 6.0 + t * 0.05) * 0.35 + 0.65;',
    '    ink += smoothstep(0.16 * w, 0.0, dist) * tp.z;',
    '  }',
    '  ink = min(ink, 1.0);',
    '  float g = (hash(gl_FragCoord.xy + fract(t) * 100.0) - 0.5) * 0.035;',
    '  vec3 paper = vec3(0.988, 0.988, 0.98) * tone;',
    '  vec3 inkCol = vec3(0.42, 0.42, 0.41);',
    '  vec3 col = mix(paper, inkCol, ink * 0.10) + g;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { return null; }
    return s;
  }
  const prog = gl.createProgram();
  const v = shader(gl.VERTEX_SHADER, vs);
  const f = shader(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) return;
  gl.attachShader(prog, v);
  gl.attachShader(prog, f);
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, 'res');
  const uT = gl.getUniformLocation(prog, 't');
  const uTrail = gl.getUniformLocation(prog, 'trail');

  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }
  resize();
  addEventListener('resize', resize);

  const pts = [];
  for (let i = 0; i < TRAIL; i++) pts.push({ x: 0.5, y: 0.5, a: 0 });
  let head = 0, lastX = null, lastY = null;

  addEventListener('pointermove', (e) => {
    const x = e.clientX / innerWidth;
    const y = 1.0 - e.clientY / innerHeight;
    if (lastX !== null && Math.hypot(x - lastX, y - lastY) < 0.008) return;
    lastX = x; lastY = y;
    pts[head] = { x: x, y: y, a: 1.0 };
    head = (head + 1) % TRAIL;
  }, { passive: true });

  const flat = new Float32Array(TRAIL * 3);
  let start = performance.now();
  let visible = true;
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; });
  function frame(now) {
    requestAnimationFrame(frame);
    if (!visible) return;
    const t = (now - start) / 1000;
    for (let i = 0; i < TRAIL; i++) {
      pts[i].a = Math.max(0, pts[i].a - 0.008);
      flat[i * 3] = pts[i].x;
      flat[i * 3 + 1] = pts[i].y;
      flat[i * 3 + 2] = pts[i].a;
    }
    gl.uniform1f(uT, t);
    gl.uniform3fv(uTrail, flat);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
