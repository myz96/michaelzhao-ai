<script>
(function () {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* ---- cursor dot ---- */
  if (finePointer && !reduced) {
    const dot = document.getElementById('dot');
    let tx = -100, ty = -100, x = -100, y = -100, shown = false;
    addEventListener('pointermove', (e) => {
      tx = e.clientX; ty = e.clientY;
      if (!shown) { shown = true; document.body.classList.add('has-dot'); }
    }, { passive: true });
    document.querySelectorAll('a').forEach((a) => {
      a.addEventListener('pointerenter', () => document.body.classList.add('dot-grow'));
      a.addEventListener('pointerleave', () => document.body.classList.remove('dot-grow'));
    });
    (function loop() {
      x += (tx - x) * 0.18;
      y += (ty - y) * 0.18;
      dot.style.transform = 'translate(' + (x - 3) + 'px,' + (y - 3) + 'px)';
      requestAnimationFrame(loop);
    })();
  }

  /* ---- magnetic corner links ---- */
  if (finePointer && !reduced) {
    document.querySelectorAll('.corner a, .works a').forEach((a) => {
      a.addEventListener('pointermove', (e) => {
        const r = a.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2);
        const dy = e.clientY - (r.top + r.height / 2);
        a.style.transform = 'translate(' + dx * 0.12 + 'px,' + dy * 0.18 + 'px)';
      });
      a.addEventListener('pointerleave', () => { a.style.transform = ''; });
    });
  }

  /* ---- ink shader ---- */
  if (reduced) return;
  const canvas = document.getElementById('ink');
  const gl = canvas.getContext('webgl', { alpha: true, antialias: false });
  if (!gl) return;

  const TRAIL = 24;

  const vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
  const fs = [
    'precision highp float;',
    'uniform vec2 res;',
    'uniform float t;',
    'uniform vec3 trail[' + TRAIL + '];',
    'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float noise(vec2 p) {',
    '  vec2 i = floor(p), f = fract(p);',
    '  vec2 u = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),',
    '             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
    '}',
    'float fbm(vec2 p) {',
    '  float v = 0.0, a = 0.5;',
    '  for (int i = 0; i < 4; i++) { v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }',
    '  return v;',
    '}',
    'void main() {',
    '  vec2 uv = gl_FragCoord.xy / res;',
    '  vec2 asp = vec2(res.x / res.y, 1.0);',
    '  float field = fbm(uv * asp * 2.2 + vec2(t * 0.015, -t * 0.01));',
    '  float tone = 0.985 + field * 0.015;',
    '  float ink = 0.0;',
    '  for (int i = 0; i < ' + TRAIL + '; i++) {',
    '    vec3 tp = trail[i];',
    '    if (tp.z <= 0.0) continue;',
    '    vec2 d = (uv - tp.xy) * asp;',
    '    float dist = length(d);',
    '    float w = fbm(uv * asp * 6.0 + t * 0.05) * 0.35 + 0.65;',
    '    ink += smoothstep(0.16 * w, 0.0, dist) * tp.z;',
    '  }',
    '  ink = min(ink, 1.0);',
    '  float g = (hash(gl_FragCoord.xy + fract(t) * 100.0) - 0.5) * 0.035;',
    '  vec3 paper = vec3(0.988, 0.988, 0.98) * tone;',
    '  vec3 inkCol = vec3(0.42, 0.42, 0.41);',
    '  vec3 col = mix(paper, inkCol, ink * 0.10) + g;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { return null; }
    return s;
  }
  const prog = gl.createProgram();
  const v = shader(gl.VERTEX_SHADER, vs);
  const f = shader(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) return;
  gl.attachShader(prog, v);
  gl.attachShader(prog, f);
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, 'res');
  const uT = gl.getUniformLocation(prog, 't');
  const uTrail = gl.getUniformLocation(prog, 'trail');

  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }
  resize();
  addEventListener('resize', resize);

  const pts = [];
  for (let i = 0; i < TRAIL; i++) pts.push({ x: 0.5, y: 0.5, a: 0 });
  let head = 0, lastX = null, lastY = null;

  addEventListener('pointermove', (e) => {
    const x = e.clientX / innerWidth;
    const y = 1.0 - e.clientY / innerHeight;
    if (lastX !== null && Math.hypot(x - lastX, y - lastY) < 0.008) return;
    lastX = x; lastY = y;
    pts[head] = { x: x, y: y, a: 1.0 };
    head = (head + 1) % TRAIL;
  }, { passive: true });

  const flat = new Float32Array(TRAIL * 3);
  let start = performance.now();
  let visible = true;
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; });
  function frame(now) {
    requestAnimationFrame(frame);
    if (!visible) return;
    const t = (now - start) / 1000;
    for (let i = 0; i < TRAIL; i++) {
      pts[i].a = Math.max(0, pts[i].a - 0.008);
      flat[i * 3] = pts[i].x;
      flat[i * 3 + 1] = pts[i].y;
      flat[i * 3 + 2] = pts[i].a;
    }
    gl.uniform1f(uT, t);
    gl.uniform3fv(uTrail, flat);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
})();

/* ---- watermelon boy: he WHACKS the melon toward your cursor, then chases it ---- */
(function () {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const scene = document.getElementById('melon-scene');
  const melon = document.getElementById('melon');
  const spin = document.getElementById('melon-spin');
  const boy = document.getElementById('boy');
  const lean = document.getElementById('boy-lean');
  const legA = document.getElementById('legA');
  const legB = document.getElementById('legB');
  const armB = document.getElementById('armB');
  const armF = document.getElementById('armF');
  if (!scene || reduced) { if (scene) scene.style.display = 'none'; return; }

  const mShadow = document.getElementById('melon-shadow');
  const bShadow = document.getElementById('boy-shadow');
  const dust = document.getElementById('dust');
  const dustDots = dust ? Array.from(dust.children) : [];

  const R = 26;             // melon radius
  const GROUND = 116;       // ground y inside the 130px-tall scene
  const MARGIN = 70;
  const HIT_GAP = R + 12;   // where the boy stands to push
  const ARRIVE = 46;        // "close enough" to the cursor

  let targetX = innerWidth * 0.62;
  let mx = innerWidth * 0.38, mv = 0, rot = 0;
  let bx = mx - HIT_GAP, bv = 0;
  let phase = 0, idleBlend = 0, pushT = -1, pushDir = 1, shoved = false, pushBlend = 0;
  let dustT = -1, dustX = 0, dustDir = 1;
  let wobbleE = 0, wasFast = false;
  // states: 'approach' (run behind melon) -> 'push' (lean in + shove) -> 'chase' (melon rolling) -> 'idle'
  let state = 'idle';

  const touch = window.matchMedia('(hover: none)').matches;
  if (!touch) {
    addEventListener('pointermove', (e) => { targetX = e.clientX; }, { passive: true });
  } else {
    setInterval(() => { targetX = MARGIN + Math.random() * (innerWidth - MARGIN * 2); }, 6000);
  }

  function clampT() { return Math.max(MARGIN, Math.min(innerWidth - MARGIN, targetX)); }

  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 16.7, 3);
    last = now;

    const tx = clampT();
    const dist = tx - mx;
    const need = Math.abs(dist) > ARRIVE;
    const dir = Math.sign(dist) || 1;

    /* ---- state transitions ---- */
    if (state === 'idle' && need) state = 'approach';
    if (state === 'approach') {
      const spot = mx - dir * HIT_GAP;
      if (!need) { state = 'idle'; }
      else if (Math.abs(bx - spot) < 7 && Math.abs(mv) < 0.6) {
        state = 'push'; pushT = 0; pushDir = dir; shoved = false;
      }
    } else if (state === 'push') {
      pushT += dt * 16.7;
      if (pushT > 150 && !shoved) {
        // the shove: strength scales with how far the melon must travel
        const impulse = Math.min(2.8 + Math.abs(clampT() - mx) * 0.010, 9.5);
        mv += pushDir * impulse;
        shoved = true;
        // ink dust at the contact point
        dustT = 0; dustX = mx - pushDir * (R - 3); dustDir = pushDir;
      }
      if (pushT > 380) state = 'chase';
    } else if (state === 'chase') {
      if (Math.abs(mv) < 0.5) state = need ? 'approach' : 'idle';
    }

    /* ---- melon: free rolling with friction; only the boy moves it ---- */
    mv *= Math.pow(0.985, dt);
    mx += mv * dt;
    if (mx < MARGIN)              { mx = MARGIN;              mv = Math.abs(mv) * 0.4; }
    if (mx > innerWidth - MARGIN) { mx = innerWidth - MARGIN; mv = -Math.abs(mv) * 0.4; }
    rot += (mv * dt) / R;

    /* ---- settle wobble: rocks a little as it stops ---- */
    const fast = Math.abs(mv) > 1.4;
    if (wasFast && !fast) wobbleE = 1;
    wasFast = fast;
    wobbleE *= Math.pow(0.965, dt);
    const wobble = Math.sin(now * 0.018) * 6 * wobbleE;

    /* ---- boy movement ---- */
    let goal;
    if (state === 'approach')      goal = mx - dir * HIT_GAP;
    else if (state === 'push')     goal = mx - pushDir * HIT_GAP;      // stays glued to the melon
    else if (state === 'chase')    goal = mx - Math.sign(mv || 1) * HIT_GAP;
    else                           goal = mx - (bx < mx ? 1 : -1) * HIT_GAP;
    bv += (goal - bx) * 0.006 * dt;
    bv *= Math.pow(0.90, dt);
    bx += bv * dt;

    /* ---- pose blends ---- */
    const wantIdle = state === 'idle' ? 1 : 0;
    idleBlend += (wantIdle - idleBlend) * 0.05 * dt;
    const wantPush = (state === 'push' || (state === 'chase' && Math.abs(mx - bx) < HIT_GAP + 14)) ? 1 : 0;
    pushBlend += (wantPush - pushBlend) * 0.12 * dt;

    /* ---- walk cycle ---- */
    const speed = Math.min(Math.abs(bv) / 3.5, 1);
    phase += Math.abs(bv) * 0.045 * dt;
    const walkSwing = Math.sin(phase) * 28 * speed * (1 - idleBlend);
    const bob = -Math.abs(Math.sin(phase)) * 3 * speed * (1 - idleBlend);

    const face = (state === 'push') ? pushDir : ((mx >= bx) ? 1 : -1);

    /* ---- pushing pose: lean in, both arms forward on the melon ---- */
    const leanIn = pushBlend * 14 + idleBlend * 5;
    const armFrontRot = -38 * pushBlend + 10 * idleBlend + walkSwing * 0.25 * (1 - pushBlend);
    const armBackRot  =  62 * pushBlend - 12 * idleBlend - walkSwing * 0.5  * (1 - pushBlend);

    melon.setAttribute('transform', 'translate(' + mx + ',' + (GROUND - R) + ')');
    spin.setAttribute('transform', 'rotate(' + (rot * 57.2958 + wobble) + ')');
    mShadow.setAttribute('transform', 'translate(' + mx + ',' + (GROUND + 2) + ')');
    bShadow.setAttribute('transform', 'translate(' + bx + ',' + (GROUND + 2) + ')');

    boy.setAttribute('transform', 'translate(' + bx + ',' + (GROUND + bob) + ') scale(' + face + ',1)');
    lean.setAttribute('transform', 'rotate(' + leanIn + ')');
    legA.setAttribute('transform', 'rotate(' + (walkSwing - idleBlend * 4 - pushBlend * 10) + ' -1 -18)');
    legB.setAttribute('transform', 'rotate(' + (-walkSwing + idleBlend * 6 + pushBlend * 14) + ' 3 -18)');
    armB.setAttribute('transform', 'rotate(' + armBackRot + ' -2 -34)');
    armF.setAttribute('transform', 'rotate(' + armFrontRot + ' 2 -34)');

    /* ---- dust puffs ---- */
    if (dustT >= 0) {
      dustT += dt * 16.7;
      const life = 520;
      if (dustT > life) {
        dustT = -1;
        dust.setAttribute('opacity', '0');
      } else {
        const p = dustT / life;
        dust.setAttribute('opacity', String(0.5 * (1 - p)));
        // each puff drifts back (away from the push) and up at its own rate
        const spread = [[1.0, 0.55], [0.55, 1.0], [1.35, 0.25], [0.3, 0.8]];
        for (let i = 0; i < dustDots.length; i++) {
          const px = dustX - dustDir * spread[i][0] * (5 + p * 26);
          const py = GROUND - 6 - spread[i][1] * (3 + p * 17);
          dustDots[i].setAttribute('cx', String(px));
          dustDots[i].setAttribute('cy', String(py));
          dustDots[i].setAttribute('r', String((1.4 + i * 0.3) * (1 + p * 0.8)));
        }
      }
    }
  }
  requestAnimationFrame(frame);
})();
</script>
