:root { --white: #fbf9f2; --black: #111110; --grey: #8a8a85; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {

#ink {

  border-radius: 50%;
  background: var(--black);
  pointer-events: none;
  z-index: 10;
  transform: translate(-100px, -100px);
  transition: width 0.25s, height 0.25s, opacity 0.25s;
  opacity: 0;
}
body.has-dot #dot { opacity: 0.85; }
body.has-dot.dot-grow #dot { width: 14px; height: 14px; opacity: 0.35; }
@media (hover: none) { #dot { display: none; } }

.corner, main { position: relative; z-index: 1; }
.corner {

  font-family: 'IBM Plex Mono', monospace;

<script>
(function () {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* ---- cursor dot ---- */
  if (finePointer && !reduced) {
    const dot = document.getElementById('dot');
    let tx = -100, ty = -100, x = -100, y = -100, shown = false;
    addEventListener('pointermove', (e) => {
      tx = e.clientX; ty = e.clientY;
      if (!shown) { shown = true; document.body.classList.add('has-dot'); }
    }, { passive: true });
    document.querySelectorAll('a').forEach((a) => {
      a.addEventListener('pointerenter', () => document.body.classList.add('dot-grow'));
      a.addEventListener('pointerleave', () => document.body.classList.remove('dot-grow'));
    });
    (function loop() {
      x += (tx - x) * 0.18;
      y += (ty - y) * 0.18;
      dot.style.transform = 'translate(' + (x - 3) + 'px,' + (y - 3) + 'px)';
      requestAnimationFrame(loop);
    })();
  }

  /* ---- magnetic corner links ---- */
  if (finePointer && !reduced) {
    document.querySelectorAll('.corner a, .works a').forEach((a) => {
      a.addEventListener('pointermove', (e) => {
        const r = a.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2);
        const dy = e.clientY - (r.top + r.height / 2);
        a.style.transform = 'translate(' + dx * 0.12 + 'px,' + dy * 0.18 + 'px)';
      });
      a.addEventListener('pointerleave', () => { a.style.transform = ''; });
    });
  }

  /* ---- ink shader ---- */
  if (reduced) return;
  const canvas = document.getElementById('ink');
  const gl = canvas.getContext('webgl', { alpha: true, antialias: false });
  if (!gl) return;

  const TRAIL = 24;

  const vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
  const fs = [
    'precision highp float;',
    'uniform vec2 res;',
    'uniform float t;',
    'uniform vec3 trail[' + TRAIL + '];',
    'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float noise(vec2 p) {',
    '  vec2 i = floor(p), f = fract(p);',
    '  vec2 u = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),',
    '             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
    '}',
    'float fbm(vec2 p) {',
    '  float v = 0.0, a = 0.5;',
    '  for (int i = 0; i < 4; i++) { v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }',
    '  return v;',
    '}',
    'void main() {',
    '  vec2 uv = gl_FragCoord.xy / res;',
    '  vec2 asp = vec2(res.x / res.y, 1.0);',
    '  float field = fbm(uv * asp * 2.2 + vec2(t * 0.015, -t * 0.01));',
    '  float mottle = fbm(uv * asp * 4.5 + 17.3);',
    '  float fibH = noise(vec2(uv.x * asp.x * 3.0, uv.y * 260.0));',
    '  float fibV = noise(vec2(uv.x * asp.x * 210.0, uv.y * 3.5 + 5.0));',
    '  float fleck = step(0.999, hash(floor(uv * asp * 640.0) + 2.7));',
    '  float tone = 0.982 + field * 0.012 + mottle * 0.018 + (fibH + fibV) * 0.006 - fleck * 0.035;',
    '  float ink = 0.0;',
    '  for (int i = 0; i < ' + TRAIL + '; i++) {',
    '    vec3 tp = trail[i];',
    '    if (tp.z <= 0.0) continue;',
    '    vec2 d = (uv - tp.xy) * asp;',
    '    float dist = length(d);',
    '    float w = fbm(uv * asp * 6.0 + t * 0.05) * 0.35 + 0.65;',
    '    ink += smoothstep(0.16 * w, 0.0, dist) * tp.z;',
    '  }',
    '  ink = min(ink, 1.0);',
    '  float g = (hash(gl_FragCoord.xy + fract(t) * 100.0) - 0.5) * 0.035;',
    '  vec3 paper = vec3(0.984, 0.976, 0.949) * tone;',
    '  vec3 inkCol = vec3(0.40, 0.37, 0.33);',
    '  vec3 col = mix(paper, inkCol, ink * 0.10) + g;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { return null; }
    return s;
  }
  const prog = gl.createProgram();
  const v = shader(gl.VERTEX_SHADER, vs);
  const f = shader(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) return;
  gl.attachShader(prog, v);
  gl.attachShader(prog, f);
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, 'res');
  const uT = gl.getUniformLocation(prog, 't');
  const uTrail = gl.getUniformLocation(prog, 'trail');

  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }
  resize();
  addEventListener('resize', resize);

  const pts = [];
  for (let i = 0; i < TRAIL; i++) pts.push({ x: 0.5, y: 0.5, a: 0 });
  let head = 0, lastX = null, lastY = null;

  addEventListener('pointermove', (e) => {
    const x = e.clientX / innerWidth;
    const y = 1.0 - e.clientY / innerHeight;
    if (lastX !== null && Math.hypot(x - lastX, y - lastY) < 0.008) return;
    lastX = x; lastY = y;
    pts[head] = { x: x, y: y, a: 1.0 };
    head = (head + 1) % TRAIL;
  }, { passive: true });

  const flat = new Float32Array(TRAIL * 3);
  let start = performance.now();
  let visible = true;
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; });
  function frame(now) {
    requestAnimationFrame(frame);
    if (!visible) return;
    const t = (now - start) / 1000;
    for (let i = 0; i < TRAIL; i++) {
      pts[i].a = Math.max(0, pts[i].a - 0.008);
      flat[i * 3] = pts[i].x;
      flat[i * 3 + 1] = pts[i].y;
      flat[i * 3 + 2] = pts[i].a;
    }
    gl.uniform1f(uT, t);
    gl.uniform3fv(uTrail, flat);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
})();

/* ---- watermelon boy: he WHACKS the melon toward your cursor, then chases it ---- */
(function () {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const scene = document.getElementById('melon-scene');
  const melon = document.getElementById('melon');
  const spin = document.getElementById('melon-spin');
  const boy = document.getElementById('boy');
  const lean = document.getElementById('boy-lean');
  const legA = document.getElementById('legA');
  const legB = document.getElementById('legB');
  const armB = document.getElementById('armB');
  const armF = document.getElementById('armF');
  if (!scene || reduced) { if (scene) scene.style.display = 'none'; return; }

  const mShadow = document.getElementById('melon-shadow');
  const bShadow = document.getElementById('boy-shadow');
  const dust = document.getElementById('dust');
  const dustDots = dust ? Array.from(dust.children) : [];

  const R = 52;             // melon radius (drawn at 2x for the ASCII strip)
  const GROUND = 244;       // ground y inside the 260px-tall scene
  const MARGIN = 90;
  const HIT_GAP = R + 22;   // where the boy stands to push
  const ARRIVE = 70;        // "close enough" to the cursor

  let targetX = innerWidth * 0.62;
  let mx = innerWidth * 0.38, mv = 0, rot = 0;
  let bx = mx - HIT_GAP, bv = 0;
  let phase = 0, idleBlend = 0, pushT = -1, pushDir = 1, shoved = false, pushBlend = 0;
  let dustT = -1, dustX = 0, dustDir = 1;
  let wobbleE = 0, wasFast = false;
  // states: 'approach' (run behind melon) -> 'push' (lean in + shove) -> 'chase' (melon rolling) -> 'idle'
  let state = 'idle';
  // the agent HUD listens to these: episode start, each shove, arrival
  const emit = (type, extra) => dispatchEvent(new CustomEvent('melon', { detail: Object.assign({ type: type, mx: mx, tx: clampT() }, extra || {}) }));

  const touch = window.matchMedia('(hover: none)').matches;
  if (!touch) {
    addEventListener('pointermove', (e) => { targetX = e.clientX; }, { passive: true });
  } else {
    setInterval(() => { targetX = MARGIN + Math.random() * (innerWidth - MARGIN * 2); }, 6000);
  }

  function clampT() { return Math.max(MARGIN, Math.min(innerWidth - MARGIN, targetX)); }

  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 16.7, 3);
    last = now;

    const tx = clampT();
    window.__melon = { tx: tx, mx: mx, state: state, ground: GROUND };
    const dist = tx - mx;
    const need = Math.abs(dist) > ARRIVE;
    const dir = Math.sign(dist) || 1;

    /* ---- state transitions ---- */
    if (state === 'idle' && need) { state = 'approach'; emit('start'); }
    if (state === 'approach') {
      const spot = mx - dir * HIT_GAP;
      if (!need) { state = 'idle'; emit('done'); }
      else if (Math.abs(bx - spot) < 7 && Math.abs(mv) < 0.6) {
        state = 'push'; pushT = 0; pushDir = dir; shoved = false;
      }
    } else if (state === 'push') {
      pushT += dt * 16.7;
      if (pushT > 150 && !shoved) {
        // the shove: strength scales with how far the melon must travel
        const impulse = Math.min(2.8 + Math.abs(clampT() - mx) * 0.010, 9.5);
        mv += pushDir * impulse;
        shoved = true;
        emit('shove', { impulse: impulse });
        // ink dust at the contact point
        dustT = 0; dustX = mx - pushDir * (R - 3); dustDir = pushDir;
      }
      if (pushT > 380) state = 'chase';
    } else if (state === 'chase') {
      if (Math.abs(mv) < 0.5) { state = need ? 'approach' : 'idle'; if (state === 'idle') emit('done'); }
    }

    /* ---- melon: free rolling with friction; only the boy moves it ---- */
    mv *= Math.pow(0.985, dt);
    mx += mv * dt;
    if (mx < MARGIN)              { mx = MARGIN;              mv = Math.abs(mv) * 0.4; }
    if (mx > innerWidth - MARGIN) { mx = innerWidth - MARGIN; mv = -Math.abs(mv) * 0.4; }
    rot += (mv * dt) / R;

    /* ---- settle wobble: rocks a little as it stops ---- */
    const fast = Math.abs(mv) > 1.4;
    if (wasFast && !fast) wobbleE = 1;
    wasFast = fast;
    wobbleE *= Math.pow(0.965, dt);
    const wobble = Math.sin(now * 0.018) * 6 * wobbleE;

    /* ---- boy movement ---- */
    let goal;
    if (state === 'approach')      goal = mx - dir * HIT_GAP;
    else if (state === 'push')     goal = mx - pushDir * HIT_GAP;      // stays glued to the melon
    else if (state === 'chase')    goal = mx - Math.sign(mv || 1) * HIT_GAP;
    else                           goal = mx - (bx < mx ? 1 : -1) * HIT_GAP;
    bv += (goal - bx) * 0.006 * dt;
    bv *= Math.pow(0.90, dt);
    bx += bv * dt;

    /* ---- pose blends ---- */
    const wantIdle = state === 'idle' ? 1 : 0;
    idleBlend += (wantIdle - idleBlend) * 0.05 * dt;
    const wantPush = (state === 'push' || (state === 'chase' && Math.abs(mx - bx) < HIT_GAP + 14)) ? 1 : 0;
    pushBlend += (wantPush - pushBlend) * 0.12 * dt;

    /* ---- walk cycle ---- */
    const speed = Math.min(Math.abs(bv) / 3.5, 1);
    phase += Math.abs(bv) * 0.045 * dt;
    const walkSwing = Math.sin(phase) * 28 * speed * (1 - idleBlend);
    const bob = -Math.abs(Math.sin(phase)) * 3 * speed * (1 - idleBlend);

    const face = (state === 'push') ? pushDir : ((mx >= bx) ? 1 : -1);

    /* ---- pushing pose: lean in, both arms forward on the melon ---- */
    const leanIn = pushBlend * 14 + idleBlend * 5;
    const armFrontRot = -38 * pushBlend + 10 * idleBlend + walkSwing * 0.25 * (1 - pushBlend);
    const armBackRot  =  62 * pushBlend - 12 * idleBlend - walkSwing * 0.5  * (1 - pushBlend);

    melon.setAttribute('transform', 'translate(' + mx + ',' + (GROUND - R) + ') scale(2)');
    spin.setAttribute('transform', 'rotate(' + (rot * 57.2958 + wobble) + ')');
    mShadow.setAttribute('transform', 'translate(' + mx + ',' + (GROUND + 2) + ') scale(2)');
    bShadow.setAttribute('transform', 'translate(' + bx + ',' + (GROUND + 2) + ') scale(2)');

    boy.setAttribute('transform', 'translate(' + bx + ',' + (GROUND + bob) + ') scale(' + (face * 2) + ',2)');
    lean.setAttribute('transform', 'rotate(' + leanIn + ')');
    legA.setAttribute('transform', 'rotate(' + (walkSwing - idleBlend * 4 - pushBlend * 10) + ' -1 -18)');
    legB.setAttribute('transform', 'rotate(' + (-walkSwing + idleBlend * 6 + pushBlend * 14) + ' 3 -18)');
    armB.setAttribute('transform', 'rotate(' + armBackRot + ' -2 -34)');
    armF.setAttribute('transform', 'rotate(' + armFrontRot + ' 2 -34)');

    /* ---- dust puffs ---- */
    if (dustT >= 0) {
      dustT += dt * 16.7;
      const life = 520;
      if (dustT > life) {
        dustT = -1;
        dust.setAttribute('opacity', '0');
      } else {
        const p = dustT / life;
        dust.setAttribute('opacity', String(0.5 * (1 - p)));
        // each puff drifts back (away from the push) and up at its own rate
        const spread = [[1.0, 0.55], [0.55, 1.0], [1.35, 0.25], [0.3, 0.8]];
        for (let i = 0; i < dustDots.length; i++) {
          const px = dustX - dustDir * spread[i][0] * (10 + p * 52);
          const py = GROUND - 6 - spread[i][1] * (6 + p * 34);
          dustDots[i].setAttribute('cx', String(px));
          dustDots[i].setAttribute('cy', String(py));
          dustDots[i].setAttribute('r', String((2.8 + i * 0.6) * (1 + p * 0.8)));
        }
      }
    }
  }
  requestAnimationFrame(frame);
})();

/* ---- ASCII strip: rasterise the melon scene each frame and draw it as glyphs ---- */
(function () {
  'use strict';
  const scene = document.getElementById('melon-scene');
  const canvas = document.getElementById('strip');
  if (!scene || !canvas || getComputedStyle(scene).display === 'none') return;
  const ctx = canvas.getContext('2d');
  const buf = document.createElement('canvas');
  const bctx = buf.getContext('2d', { willReadFrequently: true });
  const ser = new XMLSerializer();
  const CW = 5, CH = 8, H = scene.getBoundingClientRect().height;
  const RAMP = '.:-=+*%#@';
  let W = 0, cols = 0, rows = 0, busy = false;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = '500 7.5px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    buf.width = W; buf.height = H;
    cols = Math.ceil(W / CW); rows = Math.ceil(H / CH);
  }

  function draw(img) {
    bctx.clearRect(0, 0, W, H);
    bctx.drawImage(img, 0, 0, W, H);
    const d = bctx.getImageData(0, 0, W, H).data;
    ctx.clearRect(0, 0, W, H);
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        // area-average the cell: ink coverage plus the mean colour of inked pixels
        let ink = 0, r = 0, g = 0, b = 0, n = 0;
        for (let y = cy * CH; y < Math.min(H, cy * CH + CH); y += 2) {
          for (let x = cx * CW; x < Math.min(W, cx * CW + CW); x += 2) {
            const p = (y * W + x) * 4, a = d[p + 3] / 255;
            n++;
            if (a < 0.02) continue;
            const k = (1 - (0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2]) / 255) * a;
            ink += k; r += d[p] * k; g += d[p + 1] * k; b += d[p + 2] * k;
          }
        }
        if (!n) continue;
        const cov = ink / n;
        if (cov < 0.06) continue;
        const glyph = RAMP[Math.min(RAMP.length - 1, Math.floor(Math.pow(cov, 0.7) * RAMP.length))];
        r /= ink; g /= ink; b /= ink;
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        const alpha = Math.min(1, 0.35 + cov * 1.4).toFixed(2);
        ctx.fillStyle = mx && (mx - mn) / mx > 0.12
          ? 'rgba(' + (r * 0.8 | 0) + ',' + (g * 0.8 | 0) + ',' + (b * 0.8 | 0) + ',' + alpha + ')'
          : 'rgba(22,20,16,' + alpha + ')';
        ctx.fillText(glyph, cx * CW + CW / 2, cy * CH + CH / 2);
      }
    }
    drawGoal();
  }

  // Demo E exposes the agent's goal: a red flag at the target and a faint planned path.
  function drawGoal() {
    const m = window.__melon;
    if (!m || m.state === 'idle') return;
    const gx = Math.round(m.tx / CW) * CW + CW / 2, gy = m.ground;
    ctx.fillStyle = 'rgba(138,138,133,0.55)';
    const dir = Math.sign(m.tx - m.mx) || 1;
    for (let x = m.mx + dir * 70; dir * (gx - x) > 12; x += dir * 12) ctx.fillText('.', x, gy + 4);
    ctx.fillStyle = 'rgba(184,50,42,0.9)';
    ctx.fillText('|>', gx + 3, gy - 22);
    ctx.fillText('|', gx, gy - 14);
    ctx.fillText('|', gx, gy - 6);
    ctx.fillText('^', gx, gy + 2);
  }

  function tick() {
    requestAnimationFrame(tick);
    if (busy) return;
    busy = true;
    let s = ser.serializeToString(scene);
    s = s.replace(/ filter="url\(#inkedge\)"/g, '').replace('<svg ', '<svg width="' + W + '" height="' + H + '" ');
    const img = new Image();
    img.onload = () => { draw(img); busy = false; };
    img.onerror = () => { busy = false; };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  }

  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(tick);
})();

/* ---- agent HUD: each trip to the cursor is an episode; total reward is the surplus (余) ---- */
(function () {
  'use strict';
  const hud = document.getElementById('hud');
  const trace = document.getElementById('trace');
  const gloss = document.querySelector('.gloss');
  const scene = document.getElementById('melon-scene');
  if (!scene || getComputedStyle(scene).display === 'none') { document.getElementById('agent').style.display = 'none'; }
  const KEY = 'melon-surplus';
  let ep = 0, shoves = 0, active = false, lastR = null, surplus = 0, best = null;
  try { surplus = parseFloat(localStorage.getItem(KEY)) || 0; } catch (e) { /* storage blocked */ }

  function sign(v) { return (v >= 0 ? '+' : '') + v.toFixed(1); }
  function render() {
    hud.innerHTML =
      '<div class="meta">Agent · melon-01</div>' +
      '<div class="meta">Ep ' + ep + ' · shoves ' + shoves + ' · reward ' + (lastR === null ? '—' : sign(lastR)) + '</div>' +
      '<b><span class="yu">余</span> surplus ' + surplus.toFixed(1) + '</b>' +
      '<span class="extra">' + (best !== null ? ' · best ' + best + ' shove' + (best > 1 ? 's' : '') : '') +
      (truncated ? ' · truncated ' + truncated : '') + '</span>';
  }
  function say(t) {
    trace.textContent = t;
    trace.classList.add('on');
    clearTimeout(say.timer);
    say.timer = setTimeout(() => trace.classList.remove('on'), 2800);
  }

  let goal = 0, truncated = 0;
  // A goal that moves far mid-episode truncates it (no reward) and starts a new one.
  setInterval(() => {
    const m = window.__melon;
    if (!active || !m || Math.abs(m.tx - goal) < 160) return;
    truncated++;
    say('ep ' + ep + ' · goal moved · truncated after ' + shoves + ' shove' + (shoves === 1 ? '' : 's'));
    ep++; shoves = 0; goal = m.tx;
    render();
  }, 200);

  addEventListener('melon', (e) => {
    const d = e.detail;
    if (d.type === 'start') {
      ep++; shoves = 0; active = true; goal = d.tx;
      say('ep ' + ep + ' · goal: melon → x=' + Math.round(d.tx) + ' · Δ ' + Math.round(Math.abs(d.tx - d.mx)) + 'px');
    } else if (d.type === 'shove') {
      if (!active) { ep++; shoves = 0; active = true; goal = d.tx; }
      shoves++;
      say('ep ' + ep + ' · shove ' + shoves + ' · impulse ' + d.impulse.toFixed(1));
    } else if (d.type === 'done') {
      if (!active) return;
      active = false;
      if (!shoves) { ep--; trace.classList.remove('on'); render(); return; } // the goal came to the melon
      lastR = Math.max(0.1, 1 - 0.1 * (shoves - 1));
      surplus += lastR;
      best = best === null ? shoves : Math.min(best, shoves);
      try { localStorage.setItem(KEY, surplus.toFixed(1)); } catch (err) { /* storage blocked */ }
      say('ep ' + ep + ' · done in ' + shoves + ' shove' + (shoves > 1 ? 's' : '') + ' · reward ' + sign(lastR));
    }
    render();
  });
  render();

  // Tap toggles the gloss on touch screens; one short reveal after load hints that it exists.
  const word = document.querySelector('h1 .w1');
  if (word && gloss) {
    word.addEventListener('click', () => gloss.classList.toggle('show'));
    setTimeout(() => { gloss.classList.add('show'); setTimeout(() => gloss.classList.remove('show'), 3800); }, 2600);
  }
})();
</script>
</body>
